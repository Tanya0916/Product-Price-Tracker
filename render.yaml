services:
  - type: web
    name: product-price-tracker-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx playwright install chromium --with-deps
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MOCK_STORE_URL
        value: https://demo.inelabteamdev.com
      - key: SCRAPER_TIMEOUT_MS
        value: 25000
      - key: SCRAPER_MAX_RETRIES
        value: 3
      - key: SCRAPER_RETRY_DELAY_MS
        value: 1500

  - type: web
    name: product-price-tracker-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
