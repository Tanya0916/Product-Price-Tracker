name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Test Backend Reliability & Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci || npm install
      - name: Run backend tests
        run: |
          cd backend
          npm test

  frontend-build:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci || npm install
      - name: Build frontend bundle
        run: |
          cd frontend
          npm run build
